<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Fixers Application | PKSMP.NET</title>
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
<main class="shell">
<section class="card">
<div class="brand"><div class="logo">PKSMP.NET</div><div class="tag">TEAM FIXERS</div></div>
<h1>Team Fixers Application</h1>
<p class="subtitle">Want to help build, fight, fix, and improve PKSMP.NET? Fill out the application below.</p>
<form id="applicationForm">
<label>Minecraft Username <span>*</span><input name="minecraft_username" maxlength="32" required placeholder="Your Minecraft username"></label>
<label>Discord Username <span>*</span><input name="Discord" maxlength="32" required placeholder="Your Discord username"></label>
<label>Role <span>*</span><select name="role" required><option value="" disabled selected>Select a role</option><option>Team Fixer</option><option>Builder</option><option>PvP</option><option>Redstone</option><option>Other</option></select></label>
<label>What things are you good at? <span>*</span><textarea name="strengths" required placeholder="Tell us what you're good at..."></textarea></label>
<label>Why do you want to join the Team Fixers? <span>*</span><textarea name="why_join" required placeholder="Tell us why you want to join..."></textarea></label>
<label>How active can you be? <span>*</span><textarea name="activity" maxlength="500" required placeholder="For example: I can play most days after school."></textarea></label>
<label>Anything else you want us to know?<textarea name="anything_else" placeholder="Anything else?"></textarea></label>
<button type="submit">SUBMIT APPLICATION</button>
<strong style="position: relative; left: 300px;">
    Make sure there is no typos
</strong>
<p id="status" class="status"></p>
</form>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
